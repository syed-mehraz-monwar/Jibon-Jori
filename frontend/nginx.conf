# JibonJori frontend static server (R-025).
#
# The client talks to Supabase directly - PostgREST and pg_graphql over HTTPS, Auth
# and Storage over HTTPS, and Realtime over its own WebSocket endpoint. There is no
# first-party API origin, so this server has no `/api/` or `/socket.io/` upstream to
# proxy: it serves the built SPA and nothing else. (The Vite dev server has the same
# shape, see `vite.config.ts`.)
#
# nginx `add_header` is NOT inherited into a location block that declares any
# `add_header` of its own, so the security header set below is repeated verbatim in
# every location block that adds a header. `test-support/deployment-config.mjs`
# enforces that rule, and that the CSP allows every external origin the built
# bundle references.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version.
    server_tokens off;

    # --- security headers (R-025 / Phase 11 hardening) ------------------------
    # The SPA has no inline <script>: Vite emits an external module bundle, so
    # `script-src 'self'` needs no 'unsafe-inline'. Inline *styles* are required by
    # GSAP/React style attributes, which is why style-src allows them.
    #
    # `connect-src` must allow the Supabase project: every REST/GraphQL call, every
    # Storage signed-URL request and the Realtime WebSocket go there. `img-src` must
    # allow it too, because profile photos are served as Storage signed URLs on the
    # same host. Supabase's hosted projects live on `*.supabase.co` (and
    # `*.supabase.in` for some regions), which is what the wildcards below cover; a
    # self-hosted Supabase instance on a different host requires adding that origin
    # here as well. A deployment that changes the CSP must keep the wildcard
    # semantics, because the exact project ref is a deployment value, not a source
    # value.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self' https://maps.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.ytimg.com https://*.gstatic.com https://*.googleapis.com https://*.ggpht.com https://*.supabase.co https://*.supabase.in; font-src 'self' data:; connect-src 'self' https://maps.googleapis.com https://*.supabase.co wss://*.supabase.co https://*.supabase.in wss://*.supabase.in; frame-src https://www.youtube-nocookie.com; worker-src 'self' blob:" always;
    # Deliberately NOT set here: Strict-Transport-Security. This server listens on
    # plain HTTP and TLS is terminated upstream (R-061), so an HSTS header emitted
    # here would either be dropped or misrepresent the scheme. Set it at the TLS
    # terminator.
    # Deliberately NOT set here: Access-Control-Allow-Origin. The browser talks to
    # this origin for the app shell and to Supabase for data; CORS for the data
    # layer is Supabase's concern and is configured on the project.

    # Response compression for the text assets Vite emits.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Content hashes are in the filenames, so the bundle is immutable. Served
    # only if the file exists: a missing asset is a 404, not the SPA shell.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self' https://maps.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.ytimg.com https://*.gstatic.com https://*.googleapis.com https://*.ggpht.com https://*.supabase.co https://*.supabase.in; font-src 'self' data:; connect-src 'self' https://maps.googleapis.com https://*.supabase.co wss://*.supabase.co https://*.supabase.in wss://*.supabase.in; frame-src https://www.youtube-nocookie.com; worker-src 'self' blob:" always;
    }

    # The shell must never be cached, or a client can keep loading an old bundle
    # that references asset hashes which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self' https://maps.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.ytimg.com https://*.gstatic.com https://*.googleapis.com https://*.ggpht.com https://*.supabase.co https://*.supabase.in; font-src 'self' data:; connect-src 'self' https://maps.googleapis.com https://*.supabase.co wss://*.supabase.co https://*.supabase.in wss://*.supabase.in; frame-src https://www.youtube-nocookie.com; worker-src 'self' blob:" always;
    }

    # Leaf paths such as /login, /register, /app/search are client-side routes.
    # Anything not on disk falls back to the shell so a hard refresh works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
